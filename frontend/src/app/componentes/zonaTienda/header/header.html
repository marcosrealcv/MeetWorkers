<header class="header-container">
  <nav class="navbar">
    <!-- Logo -->
    <div class="navbar-logo">
      <img src="logo.png" alt="MeetWorkers" class="logo-image">
      <span class="logo-text">MeetWorkers</span>
    </div>

    <!-- Navigation Links -->
    <div class="navbar-center">
      <button routerLink="/" class="nav-link">Inicio</button>
      <button routerLink="/publicar-trabajo" class="nav-link accent-link">Publicar trabajo</button>
    </div>

    <!-- Right Actions -->
    <div class="navbar-right">
      @if (!authService.estaAutenticado()) {
      <button routerLink="/iniciar-sesion" class="nav-button secondary">
        Iniciar sesión
      </button>
      <button routerLink="/registro" class="nav-button primary">
        Registrarse
      </button>
      } @else {
      <div class="flex items-center gap-3">
        @if (authService.clienteActual()?.es_prestador) {
        <button class="notification-button" (click)="irAAvisosPrestador()" aria-label="Notificaciones" title="Mis avisos">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 2a5 5 0 00-5 5v2.764l-.447.894A1.5 1.5 0 005.894 13h8.212a1.5 1.5 0 001.341-2.342L15 9.764V7a5 5 0 00-5-5zM7.5 15a2.5 2.5 0 005 0h-5z" clip-rule="evenodd" />
          </svg>
          @if (cantidadAvisosNoLeidos > 0) {
          <span class="notification-badge">{{ cantidadAvisosNoLeidos }}</span>
          }
        </button>
        }

        <!-- Profile Dropdown -->
        <div class="profile-dropdown">
          <button class="profile-button" (click)="toggleDropdown()" aria-label="Perfil">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
          </button>
          
          @if (dropdownOpen) {
          <div class="dropdown-menu">
            <button routerLink="/cuenta" class="dropdown-item" (click)="toggleDropdown()">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
              </svg>
              Mi cuenta
            </button>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout" (click)="cerrarSesion()">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd" />
              </svg>
              Cerrar sesión
            </button>
          </div>
          }
        </div>
      </div>
      }
    </div>
  </nav>
</header>
