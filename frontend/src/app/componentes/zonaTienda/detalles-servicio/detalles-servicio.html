<div class="container mx-auto py-12 px-4">
    @if (proveedores().length > 0) {
        <div class="mb-8">
            <div class="header-detalles">
                <div>
                    <h1 class="text-4xl font-bold text-gray-900 mb-2">{{ servicio()?.nombre || 'Prestadores disponibles' }}</h1>
                    <p class="text-gray-600 text-lg">Selecciona un proveedor para contratar:</p>
                </div>
                <button 
                    (click)="volverASubcategorias()"
                    class="btn-volver-detalles"
                >
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                    Volver a Subcategorías
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            @for (proveedor of proveedores(); track proveedor.id) {
                <app-tarjeta-proveedor [proveedor]="proveedor"></app-tarjeta-proveedor>
            }
        </div>
    } @else {
        <div class="text-center py-12">
            <p class="text-xl text-gray-600">No hay prestadores para esta subcategoria todavia</p>
        </div>
    }
</div>
